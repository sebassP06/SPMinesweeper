        <div id="everything">
            <h2>SPMinesweeper</h2>
            <div class="dropdown">

                <div id="myDropdown" class="dropdown-content">

                    <button class="dropdwnbt" id="hard">Hard</button>
                </div>
            </div>

                    <div class="btContainer">

                    </div>
                </div>

            </div>
            </div>

            </div>
